services:
  - type: web
    name: checketop-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 scripts/ensure_jre.py
    startCommand: PATH=$PWD/bin:$PWD/jre/bin:$PATH JZCOMP_DIR=$PWD/fullbot MTS_DONOR_SBP=$PWD/fullbot/donors/file25.pdf python3 fullbot/run_render.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
