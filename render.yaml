services:
  - type: web
    name: checketop-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 scripts/ensure_jre.py
    startCommand: PATH=$PWD/bin:$PWD/jre/bin:$PATH JAVA_BIN=$PWD/jre/bin/java JZCOMP_DIR=$PWD/banks/rshb python3 bot/yandex_bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
